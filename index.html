<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Areyan</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#07111f,#102a43,#164e63);
    color:white;
    min-height:100vh;
}

/* Header */
header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:3px;
}

/* Menu */
.menu{
    position:relative;
}

.menu-button{
    font-size:30px;
    cursor:pointer;
    user-select:none;
}

.menu-box{
    display:none;
    position:absolute;
    left:0;
    top:45px;
    width:230px;
    background:white;
    color:#111;
    border-radius:15px;
    padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.menu-box button{
    width:100%;
    border:none;
    background:none;
    padding:14px;
    text-align:right;
    font-family:inherit;
    font-size:15px;
    border-radius:10px;
    cursor:pointer;
}

.menu-box button:hover{
    background:#e0f2fe;
}

/* Home */
.home{
    min-height:calc(100vh - 70px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.home-content{
    max-width:800px;
}

.home h1{
    font-size:70px;
    letter-spacing:8px;
    margin-bottom:15px;
}

.home h2{
    font-size:28px;
    margin-bottom:20px;
    color:#67e8f9;
}

.home p{
    font-size:18px;
    color:#dbeafe;
    margin-bottom:35px;
}

.start-button{
    border:none;
    padding:15px 35px;
    border-radius:30px;
    background:#06b6d4;
    color:white;
    font-family:inherit;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.start-button:hover{
    transform:translateY(-3px);
    background:#0891b2;
}

/* Exam */
.exam{
    display:none;
    max-width:800px;
    margin:auto;
    padding:40px 20px;
}

.exam-card{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.exam-title{
    text-align:center;
    margin-bottom:25px;
}

.progress{
    text-align:center;
    color:#67e8f9;
    margin-bottom:20px;
}

.question{
    font-size:21px;
    margin-bottom:25px;
    line-height:2;
}

.option{
    display:block;
    width:100%;
    padding:15px;
    margin:12px 0;
    border:2px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:white;
    border-radius:14px;
    cursor:pointer;
    text-align:right;
    font-family:inherit;
    font-size:16px;
    transition:.25s;
}

.option:hover{
    background:rgba(6,182,212,.25);
    border-color:#22d3ee;
}

.option.selected{
    background:#0891b2;
    border-color:#67e8f9;
}

.next-button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:15px;
    background:#22c55e;
    color:white;
    font-family:inherit;
    font-size:17px;
    cursor:pointer;
}

.next-button:hover{
    background:#16a34a;
}

/* Result */
.result{
    display:none;
    max-width:800px;
    margin:auto;
    padding:40px 20px;
}

.result-card{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    padding:35px;
    border-radius:25px;
    text-align:center;
}

.score{
    font-size:55px;
    font-weight:bold;
    color:#67e8f9;
    margin:20px;
}

.review{
    margin-top:30px;
    text-align:right;
}

.review-item{
    background:rgba(0,0,0,.2);
    padding:20px;
    margin:15px 0;
    border-radius:15px;
}

.correct{
    color:#4ade80;
}

.wrong{
    color:#f87171;
}

.restart{
    margin-top:25px;
    padding:13px 30px;
    border:none;
    border-radius:20px;
    background:#06b6d4;
    color:white;
    font-family:inherit;
    cursor:pointer;
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .home h1{
        font-size:48px;
    }

    .home h2{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .exam-card,
    .result-card{
        padding:22px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">AREYAN</div>

    <div class="menu">

        <div class="menu-button" onclick="toggleMenu()">⋮</div>

        <div class="menu-box" id="menuBox">

            <button onclick="openExam()">
                📚 امتحان آنلاین جغرافیه
            </button>

        </div>

    </div>

</header>


<!-- Home -->
<section class="home" id="home">

    <div class="home-content">

        <h1>AREYAN</h1>

        <h2>خوش آمدید 🌟</h2>

        <p>
            به ویب‌سایت Areyan خوش آمدید.
            آماده‌اید دانش جغرافیایی خود را امتحان کنید؟
        </p>

        <button class="start-button" onclick="openExam()">
            امتحان آنلاین جغرافیه
        </button>

    </div>

</section>


<!-- Exam -->
<section class="exam" id="exam">

    <div class="exam-card">

        <div class="exam-title">
            <h2>🌍 امتحان آنلاین جغرافیه</h2>
        </div>

        <div class="progress" id="progress"></div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <button class="next-button" onclick="nextQuestion()">
            سؤال بعدی
        </button>

    </div>

</section>


<!-- Result -->
<section class="result" id="result">

    <div class="result-card">

        <h2>🎉 امتحان تمام شد!</h2>

        <p>نمره شما:</p>

        <div class="score" id="score"></div>

        <div class="review" id="review"></div>

        <button class="restart" onclick="restartExam()">
            دوباره امتحان بده
        </button>

    </div>

</section>


<script>

const questions = [

{
    question:"تعداد موترها مطابق ثبت ترافیک در سال ۱۳۲۰ هـ.ش چقدر بود؟",
    options:["365260","365469","90876","هیچ‌کدام"],
    answer:1
},

{
    question:"زلزله چند عامل دارد؟",
    options:["2","5","4","3"],
    answer:3
},

{
    question:"طول دریای کابل در خاک افغانستان چقدر بود؟",
    options:["360 کیلومتر","140 کیلومتر","500 کیلومتر","147 کیلومتر"],
    answer:0
},

{
    question:"بند آبگردان در بالای کدام دریا اعمار شده است؟",
    options:["غزنی","کابل","هریرود","کوکچه"],
    answer:0
},

{
    question:"اولین بار آرمسترانگ امریکایی با کدام وسیله به فضا رفت؟",
    options:["آپولو 13","آپولو 11","آپولو 15","هیچ‌کدام"],
    answer:1
},

{
    question:"دریای آمو بالاخره به کجا می‌ریزد؟",
    options:["جهیل اورال","جهیل گودزیره","شمال‌غرب","1 و 3 درست است"],
    answer:0
},

{
    question:"جهیل شیوا در چند فصل سال منجمد می‌باشد؟",
    options:["4","3","1","2"],
    answer:1
},

{
    question:"وسعت کهکشان راه شیری چقدر است؟",
    options:["صد هزار سال نوری","هزار سال نوری","یک سال نوری","هیچ‌کدام"],
    answer:0
},

{
    question:"ضخامت طبقه مگما چقدر است؟",
    options:["2985 کیلومتر","2895 کیلومتر","1275 کیلومتر","8765 کیلومتر"],
    answer:1
},

{
    question:"چند فیصد کره زمین را آب تشکیل داده است؟",
    options:["78٪","79٪","71٪","99٪"],
    answer:2
}

];

let currentQuestion = 0;
let selectedAnswers = Array(questions.length).fill(null);


function toggleMenu(){

    const menu = document.getElementById("menuBox");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}


function openExam(){

    document.getElementById("home").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("exam").style.display = "block";

    document.getElementById("menuBox").style.display = "none";

    currentQuestion = 0;
    selectedAnswers = Array(questions.length).fill(null);

    showQuestion();
}


function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "سؤال " + (currentQuestion + 1) + " از " + questions.length +
        " | هر سؤال ۱۰ نمره";

    document.getElementById("question").innerText =
        q.question;

    const optionsBox = document.getElementById("options");

    optionsBox.innerHTML = "";

    q.options.forEach((option,index)=>{

        const button = document.createElement("button");

        button.className = "option";

        button.innerText =
            (index + 1) + ". " + option;

        if(selectedAnswers[currentQuestion] === index){
            button.classList.add("selected");
        }

        button.onclick = function(){

            selectedAnswers[currentQuestion] = index;

            document.querySelectorAll(".option")
                .forEach(btn => btn.classList.remove("selected"));

            button.classList.add("selected");
        };

        optionsBox.appendChild(button);

    });

    const nextButton = document.querySelector(".next-button");

    if(currentQuestion === questions.length - 1){

        nextButton.innerText = "پایان امتحان";

    }else{

        nextButton.innerText = "سؤال بعدی";

    }

}


function nextQuestion(){

    if(selectedAnswers[currentQuestion] === null){

        alert("لطفاً یکی از گزینه‌ها را انتخاب کنید.");

        return;
    }

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        showQuestion();

    }else{

        showResult();

    }

}


function showResult(){

    document.getElementById("exam").style.display = "none";
    document.getElementById("result").style.display = "block";

    let score = 0;

    questions.forEach((q,index)=>{

        if(selectedAnswers[index] === q.answer){

            score += 10;

        }

    });

    document.getElementById("score").innerText =
        score + " / 100";

    const review = document.getElementById("review");

    review.innerHTML = "<h3>📋 بررسی پاسخ‌ها</h3>";

    questions.forEach((q,index)=>{

        const item = document.createElement("div");

        item.className = "review-item";

        const userAnswer =
            selectedAnswers[index] !== null
            ? q.options[selectedAnswers[index]]
            : "انتخاب نشده";

        const correctAnswer =
            q.options[q.answer];

        const isCorrect =
            selectedAnswers[index] === q.answer;

        item.innerHTML = `

            <strong>سؤال ${index + 1}</strong>

            <p>${q.question}</p>

            <p class="${isCorrect ? "correct" : "wrong"}">
                پاسخ شما: ${userAnswer}
            </p>

            <p class="correct">
                جواب درست: ${correctAnswer}
            </p>

            <p>
                نمره: ${isCorrect ? "۱۰" : "۰"} از ۱۰
            </p>

        `;

        review.appendChild(item);

    });

}


function restartExam(){

    currentQuestion = 0;

    selectedAnswers =
        Array(questions.length).fill(null);

    document.getElementById("result").style.display = "none";

    document.getElementById("exam").style.display = "block";

    showQuestion();

}

</script>

</body>
</html>
